name: Build Kernel -- ReSukiSU

on:
  workflow_dispatch:
    inputs:
      SOURCECODE_BRANCH:
        description: '源码分支名称或修订版'
        required: true
        default: 'U-dev'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_MAXSIZE: 8G
    strategy:
      fail-fast: false
    name: Build Kernel for K40GE
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Package
        run: sudo apt update && sudo apt install -y p7zip-full git ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - uses: actions/checkout@v5

      - name: Get Kernel Source Code
        uses: actions/checkout@v5
        with:
          repository: MerCuJerry/android_kernel_aresin
          ref: ${{ inputs.SOURCECODE_BRANCH }}
          path: kernel
      
      - name: Setup Cross-compile toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          wget -q https://github.com/Mandi-Sa/clang/releases/download/amd64-kernel-arm_static-23/llvm23.0.0-binutils2.45.1_amd64-kernel-arm_static-20260224.7z
          7za x llvm23.0.0-binutils2.45.1_amd64-kernel-arm_static-20260224.7z
          rm llvm23.0.0-binutils2.45.1_amd64-kernel-arm_static-20260224.7z
      
      - name: Set up ReSukiSU
        working-directory: kernel
        run: |
          echo DATE=$(date +%F) >> $GITHUB_ENV
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          cd ./KernelSU
          export KSU_VERSION=$(expr $(/usr/bin/git rev-list --count HEAD) + 10200)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          sed -i "s/DKSU_VERSION=12800/DKSU_VERSION=$KSU_VERSION/g" Makefile

      - name: Enable Wireless and RT3070 Drivers
        working-directory: kernel
        run: |
          CONFIG_FILE=$(find arch/arm64/configs/ -name "*defconfig" | head -n 1)
          cat <<EOF >> $CONFIG_FILE

          # Wireless Core Support
          CONFIG_WIRELESS=y
          CONFIG_CFG80211=y
          CONFIG_MAC80211=y

          # Ralink RT3070 Drivers
          CONFIG_NETDEVICES=y
          CONFIG_WLAN=y
          CONFIG_RT2X00=y
          CONFIG_RT2X00_LIB_USB=y
          CONFIG_RT2X00_LIB_FIRMWARE=y
          CONFIG_RT2800USB=y
          CONFIG_RT2800USB_RT33XX=y
          CONFIG_RT2800USB_RT53XX=y
          CONFIG_RT2800USB_UNKNOWN=y
          EOF
          echo "Updated configuration file: $CONFIG_FILE"


      - name: Enable Wireless and RT3070 Drivers
        working-directory: kernel
        run: |
          CONFIG_FILE=$(find arch/arm64/configs/ -name "*defconfig" | head -n 1)
          cat <<EOF >> $CONFIG_FILE

          # Wireless Core Support
          CONFIG_WIRELESS=y
          CONFIG_CFG80211=y
          CONFIG_MAC80211=y

          # Ralink RT3070 Drivers
          CONFIG_NETDEVICES=y
          CONFIG_WLAN=y
          CONFIG_RT2X00=y
          CONFIG_RT2X00_LIB_USB=y
          CONFIG_RT2X00_LIB_FIRMWARE=y
          CONFIG_RT2800USB=y
          CONFIG_RT2800USB_RT33XX=y
          CONFIG_RT2800USB_RT53XX=y
          CONFIG_RT2800USB_UNKNOWN=y
          EOF
          echo "Updated configuration file: $CONFIG_FILE"
          
      - name: Patch Kernel
        working-directory: kernel
        run: |
          patch -p1 < $GITHUB_WORKSPACE/Patches/resukisu-scopemin-hooks.patch
          patch -p1 < $GITHUB_WORKSPACE/Patches/static-symbol-export.patch

      - name: Copy defconfig
        run: |
          echo "CONFIG_KSU=y" >> $GITHUB_WORKSPACE/kernel/arch/arm64/configs/ares_user_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> $GITHUB_WORKSPACE/kernel/arch/arm64/configs/ares_user_defconfig
          echo "KSU_MULTI_MANAGER_SUPPORT=y" >> $GITHUB_WORKSPACE/kernel/arch/arm64/configs/ares_user_defconfig
          echo "KSU_FULL_NAME_FORMAT=\"%TAG_NAME%-%KSU_VERSION%@%REPO_NAME%\"" >> $GITHUB_WORKSPACE/kernel/arch/arm64/configs/ares_user_defconfig
          echo "CONFIG_CFG80211=y" >> $GITHUB_WORKSPACE/kernel/arch/arm64/configs/ares_defconfig
          echo "CONFIG_MAC80211=y" >> $GITHUB_WORKSPACE/kernel/arch/arm64/configs/ares_defconfig
          echo "CONFIG_RT2800USB=y" >> $GITHUB_WORKSPACE/kernel/arch/arm64/configs/ares_defconfig

      - name: Build Kernel for K40GE
        working-directory: kernel
        env:
          args: |+
            LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
            CC=clang LD=ld.lld HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS_PERF+=-O3
        run: |
          export KBUILD_BUILD_TIMESTAMP=$(date)
          export PATH=/usr/lib/ccache:$GITHUB_WORKSPACE/toolchain/bin:$PATH
          make -j$(nproc --all) ${args} ares_user_defconfig all
      
      - name: Apply KernelPatch for KPM
        if: ${{ inputs.enable_feature_kpm }}
        working-directory: kernel/out/arch/arm64/boot
        run: |
          cp $GITHUB_WORKSPACE/sukisu_patch/kpm/patch_linux .
          chmod +x patch_linux
          ./patch_linux
          mv oImage Image

      - name: Pack Kernel using Magiskboot
        working-directory: Magiskboot
        run: |
            tar -xvf boot.tar.gz
            chmod +x magiskboot
            ./magiskboot unpack boot.img
            cp $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image ./kernel
            ./magiskboot repack boot.img boot_ReSukiSU_${{ env.KSUVER }}.img

      - name: Upload repacked boot image
        uses: actions/upload-artifact@v4
        with:
          name: K40GE_SukiSU_${{ env.KSUVER }}
          path: Magiskboot/boot_ReSukiSU_${{ env.KSUVER }}.img
          compression-level: 9
